<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>포켓몬 성능 시험</title>
<!--
  IPD-TASK-011 시험 페이지. 메인 화면에서 링크하지 않는다.
  목적: iPad 4(iOS 10.3.4)에서 포켓몬이 카드 뒤로 돌아다니는 화면이 부드러운지, 오래 켜 둬도 괜찮은지 잰다.
  IPD-TASK-013 보정: 화면 요소를 벽으로 삼아 포켓몬이 부딪혀 튕긴다("벽 보기").
  IPD-TASK-014 보정 2: 이동 방식 3가지(통과 = 벽 무시하고 UI 뒤로 지나감, 쉬는 곳만 빈 곳 / 벽 = 013 / 끔 = 011)와
  "UI 투명도"(시계판·카드·제목·시각·날짜의 배경색만 100/85/70/55%). 밤에는 카드·시계판도 밤 색.
  제약: 순수 HTML/CSS/JS(ES5). 외부 파일 없음(같은 폴더의 assets 그림만).
-->
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  position: fixed; left: 0; top: 0; right: 0; bottom: 0;
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #7D68D1;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-touch-callout: none;
}

/* ── 배경: 두 층을 겹치고 위층 투명도만 바꾼다(색을 직접 애니메이션하지 않음) ── */
.bg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 0; }
#bgEvening { background: #A48CEB; background: -webkit-linear-gradient(top, #A48CEB, #7D68D1); background: linear-gradient(to bottom, #A48CEB, #7D68D1); }
#bgNight {
  background: #2B3363; background: -webkit-linear-gradient(top, #2B3363, #1B2147); background: linear-gradient(to bottom, #2B3363, #1B2147);
  opacity: 0;
  -webkit-transition: opacity 1.2s linear; transition: opacity 1.2s linear;
}
#bgNight.on { opacity: 1; }
#glow {
  position: absolute; z-index: 0; border-radius: 50%;
  background: -webkit-radial-gradient(center, circle, rgba(255,255,255,0.35), rgba(255,255,255,0) 70%);
  background: radial-gradient(circle at center, rgba(255,255,255,0.35), rgba(255,255,255,0) 70%);
}

/* ── 포켓몬 층 ── */
#stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none; }
body.uiUnder #stage { z-index: 3; }   /* 카드 가림 끔: 포켓몬이 카드 위로 */
.poke {
  position: absolute; left: 0; top: 0; pointer-events: none;
  -webkit-transform: translate3d(0,0,0); transform: translate3d(0,0,0);
  -webkit-transition-property: -webkit-transform; transition-property: transform;
  -webkit-transition-timing-function: linear; transition-timing-function: linear;
}
.poke.bouncing { -webkit-transition-timing-function: ease-out; transition-timing-function: ease-out; }
.hop, .sq, .bob, .flip { position: relative; }
/* 부딪힘(IPD-TASK-013): 진행 방향으로 0.15초 눌렸다 펴진다. 기준점은 JS가 벽 쪽 변으로 정한다. */
.sq.bumpX { -webkit-animation: bumpX 0.15s ease-out 1; animation: bumpX 0.15s ease-out 1; }
.sq.bumpY { -webkit-animation: bumpY 0.15s ease-out 1; animation: bumpY 0.15s ease-out 1; }
.bob { -webkit-transform-origin: 50% 100%; transform-origin: 50% 100%;
  -webkit-animation: breathe 3s ease-in-out infinite; animation: breathe 3s ease-in-out infinite; }
.moving .bob { -webkit-animation: bob 0.5s ease-in-out infinite; animation: bob 0.5s ease-in-out infinite; }
.flip.left { -webkit-transform: scaleX(-1); transform: scaleX(-1); }
.hop.jump { -webkit-animation: jump 0.6s ease-out 1; animation: jump 0.6s ease-out 1; }
.poke img { display: block; pointer-events: auto; cursor: pointer; }
#stage.paused .bob, #stage.paused .hop { -webkit-animation-play-state: paused; animation-play-state: paused; }

.bubble {
  position: absolute; bottom: 100%; left: 50%; margin-bottom: 6px; margin-left: -10px;
  white-space: nowrap; padding: 8px 14px; border-radius: 18px;
  background: #fff; color: #2A1F57; font-size: 22px; font-weight: bold;
  border: 3px solid #2A1F57; opacity: 0; pointer-events: none;
}
.bubble.fold { left: auto; right: 50%; margin-left: 0; margin-right: -10px; }
.bubble.show { -webkit-animation: bubbleLife 4s linear 1; animation: bubbleLife 4s linear 1; }

@-webkit-keyframes breathe { 0%,100% { -webkit-transform: scale(1,1); } 50% { -webkit-transform: scale(1.02,1.03); } }
@keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,1.03); } }
@-webkit-keyframes bob {
  0%,100% { -webkit-transform: translate3d(0,0,0) scale(1.04,0.96); }
  50% { -webkit-transform: translate3d(0,-6px,0) scale(0.97,1.03); } }
@keyframes bob {
  0%,100% { transform: translate3d(0,0,0) scale(1.04,0.96); }
  50% { transform: translate3d(0,-6px,0) scale(0.97,1.03); } }
@-webkit-keyframes jump {
  0% { -webkit-transform: translate3d(0,0,0); } 40% { -webkit-transform: translate3d(0,-44px,0); }
  75% { -webkit-transform: translate3d(0,0,0); } 88% { -webkit-transform: translate3d(0,-8px,0); } 100% { -webkit-transform: translate3d(0,0,0); } }
@keyframes jump {
  0% { transform: translate3d(0,0,0); } 40% { transform: translate3d(0,-44px,0); }
  75% { transform: translate3d(0,0,0); } 88% { transform: translate3d(0,-8px,0); } 100% { transform: translate3d(0,0,0); } }
@-webkit-keyframes bumpX { 0%,100% { -webkit-transform: scale(1,1); } 50% { -webkit-transform: scale(0.82,1.08); } }
@keyframes bumpX { 0%,100% { transform: scale(1,1); } 50% { transform: scale(0.82,1.08); } }
@-webkit-keyframes bumpY { 0%,100% { -webkit-transform: scale(1,1); } 50% { -webkit-transform: scale(1.08,0.82); } }
@keyframes bumpY { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.08,0.82); } }
@-webkit-keyframes bubbleLife { 0% { opacity: 0; } 5% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes bubbleLife { 0% { opacity: 0; } 5% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }

/* ── 가짜 화면 요소 (A5-6 레이아웃 크기·위치) ── */
#ui { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none; }
#ui > * { position: absolute; pointer-events: auto; box-sizing: border-box; }
.face { border-radius: 50%; background: #fff; border: 4px solid #2A1F57; box-shadow: 0 6px 0 rgba(42,31,87,0.25); }
.face svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.digi { text-align: center; font-weight: bold; }
.date { text-align: center; font-weight: bold; }
.title { font-weight: bold; font-size: 30px; }
.card {
  background: #fff; border: 4px solid #2A1F57; border-radius: 26px;
  box-shadow: 0 6px 0 rgba(42,31,87,0.25); color: #2A1F57; font-size: 28px; font-weight: bold;
  padding: 0 20px 0 140px; overflow: hidden;
}
.card.first { border-color: #5B3FC4; }
.card .chk { position: absolute; left: 16px; top: 50%; width: 48px; height: 48px; margin-top: -28px; border-radius: 50%; border: 4px solid #2A1F57; }
.card .ico { position: absolute; left: 76px; top: 50%; width: 52px; height: 52px; margin-top: -26px; border-radius: 14px; background: #EDE8FF; }
/* ── UI 반투명(IPD-TASK-014) ──
   배경색만 rgba로 투명하게 한다. 요소 opacity는 쓰지 않는다(글자·바늘·테두리는 불투명 그대로).
   디지털 시각·날짜·제목은 글자(span) 뒤에 둥근 판(:before)을 깔고 글자색을 카드 글자색으로 바꾼다.
   판은 span 폭을 바꾸지 않게 절대 위치로 둔다(벽은 013처럼 글자 폭 그대로). 통화 버튼은 불투명 그대로. */
.digi span, .date span, .title span { position: relative; z-index: 0; display: inline-block; }
.digi span:before, .date span:before, .title span:before {
  content: ''; position: absolute; z-index: -1; left: -14px; right: -14px; top: 0; bottom: 0;
  border-radius: 16px; background: #fff;
}
.digi, .date, .title { color: #2A1F57; }
body.op85 .face, body.op85 .card, body.op85 .digi span:before, body.op85 .date span:before, body.op85 .title span:before { background: rgba(255,255,255,0.85); }
body.op70 .face, body.op70 .card, body.op70 .digi span:before, body.op70 .date span:before, body.op70 .title span:before { background: rgba(255,255,255,0.70); }
body.op55 .face, body.op55 .card, body.op55 .digi span:before, body.op55 .date span:before, body.op55 .title span:before { background: rgba(255,255,255,0.55); }
body.op85 .card .ico { background: rgba(237,232,255,0.85); }
body.op70 .card .ico { background: rgba(237,232,255,0.70); }
body.op55 .card .ico { background: rgba(237,232,255,0.55); }
/* 밤(배경 교체): 카드·시계판 #2E3768, 글자 #F3F0FF, 윤곽선 #8E96D6, 강조 #FFD166, 초침 #FF8FA3 (A5-6 표, 시험용) */
body.night .face, body.night .card, body.night .digi span:before, body.night .date span:before, body.night .title span:before { background: #2E3768; }
body.night.op85 .face, body.night.op85 .card, body.night.op85 .digi span:before, body.night.op85 .date span:before, body.night.op85 .title span:before { background: rgba(46,55,104,0.85); }
body.night.op70 .face, body.night.op70 .card, body.night.op70 .digi span:before, body.night.op70 .date span:before, body.night.op70 .title span:before { background: rgba(46,55,104,0.70); }
body.night.op55 .face, body.night.op55 .card, body.night.op55 .digi span:before, body.night.op55 .date span:before, body.night.op55 .title span:before { background: rgba(46,55,104,0.55); }
body.night .card .ico { background: #3E4886; }
body.night.op85 .card .ico { background: rgba(62,72,134,0.85); }
body.night.op70 .card .ico { background: rgba(62,72,134,0.70); }
body.night.op55 .card .ico { background: rgba(62,72,134,0.55); }
body.night .face, body.night .card, body.night .card .chk { border-color: #8E96D6; }
body.night .card.first { border-color: #FFD166; }
body.night .card, body.night .digi, body.night .date, body.night .title { color: #F3F0FF; }
body.night #hHour, body.night #ticks line { stroke: #F3F0FF; }
body.night #hMin { stroke: #FFD166; }
body.night #hSec { stroke: #FF8FA3; }
body.night #hub { fill: #F3F0FF; }
.call { border-radius: 26px; color: #fff; font-size: 34px; font-weight: bold; text-align: center; border: 4px solid rgba(0,0,0,0.15); }
.mom { background: #D6336C; } .dad { background: #1C6FD1; }

/* ── 측정 표시와 조작 줄 ── */
#stats {
  position: absolute; right: 4px; top: 4px; z-index: 10; pointer-events: none;
  background: rgba(0,0,0,0.55); color: #fff; font: 11px/1.35 Menlo, Consolas, monospace;
  padding: 4px 6px; border-radius: 4px; white-space: pre;
}
#bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 40px; z-index: 10;
  background: rgba(0,0,0,0.6); white-space: nowrap; overflow: hidden; text-align: center;
}
#bar button {
  display: inline-block; height: 32px; margin: 4px 1px; padding: 0 5px; vertical-align: top;
  font-size: 13px; color: #fff; background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; -webkit-appearance: none;
}
#bar button.sel { background: #FFD166; color: #1B2147; }
#bar .sep { display: inline-block; width: 4px; }

/* ── 벽 보기(IPD-TASK-013): 위치만 쓰는 윤곽선, 애니메이션 없음 ── */
#wallView { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 9; pointer-events: none; display: none; }
#wallView.on { display: block; }
#wallView div { position: absolute; outline: 2px dashed #FFEB3B; }
#wallView div.edge { outline-color: #7CFFB2; }
</style>
</head>
<body>
<div class="bg" id="bgEvening"></div>
<div class="bg" id="bgNight"></div>
<div id="glow"></div>

<div id="stage"></div>

<div id="ui">
  <div class="face" id="face">
    <svg viewBox="0 0 200 200" id="faceSvg">
      <g id="ticks"></g>
      <line id="hHour" x1="100" y1="100" x2="100" y2="55" stroke="#2A1F57" stroke-width="9" stroke-linecap="round"/>
      <line id="hMin" x1="100" y1="100" x2="100" y2="28" stroke="#5B3FC4" stroke-width="5" stroke-linecap="round"/>
      <line id="hSec" x1="100" y1="112" x2="100" y2="22" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
      <circle id="hub" cx="100" cy="100" r="5" fill="#2A1F57"/>
    </svg>
  </div>
  <div class="digi" id="digi"><span id="digiT">00:00</span></div>
  <div class="date" id="date"><span id="dateT">-</span></div>
  <div class="title" id="title"><span id="titleT">오늘 할 일 (0/3)</span></div>
  <div class="card first" id="c0"><span class="chk"></span><span class="ico"></span><span class="txt">가짜 할 일 하나</span></div>
  <div class="card" id="c1"><span class="chk"></span><span class="ico"></span><span class="txt">가짜 할 일 둘</span></div>
  <div class="card" id="c2"><span class="chk"></span><span class="ico"></span><span class="txt">가짜 할 일 셋</span></div>
  <div class="call mom" id="mom">엄마 (가짜)</div>
  <div class="call dad" id="dad">아빠 (가짜)</div>
</div>

<div id="wallView"></div>

<div id="stats">측정 준비 중</div>

<div id="bar">
  <button id="n1">1마리</button><button id="n3">3마리</button><button id="n5">5마리</button><span class="sep"></span>
  <button id="bBg">배경 교체</button><button id="bStop">멈춤</button><button id="bSpeed">속도: 보통</button><button id="bCover">카드 가림: 켬</button><span class="sep"></span>
  <button id="bWall">이동: 통과</button><button id="bWallView">벽 보기</button><button id="bOp">UI 투명도: 85%</button><span class="sep"></span>
  <button id="bReset">기록 초기화</button>
</div>

<script>
(function () {
  'use strict';

  // ───────── 설정 ─────────
  var SPRITES = ['pikachu', 'dragonite', 'haunter', 'koffing', 'snorlax'];
  var RATIO = { pikachu: 291 / 320, dragonite: 297 / 320, haunter: 343 / 320, koffing: 333 / 320, snorlax: 276 / 320 };
  var POKE_H = 120;          // 화면에서의 높이(px)
  var EDGE = 24;             // 화면 가장자리 여백
  var BAR_H = 40;            // 조작 줄 높이(그 위까지만 다닌다)
  var SPEED = {              // px/초, 쉬는 시간(초)
    normal: { min: 40, max: 70, restMin: 3, restMax: 8 },
    slow:   { min: 15, max: 25, restMin: 6, restMax: 14 }
  };
  var STORE_KEY = 'ipd.sprite-test';   // 시험용 저장 키(개인정보 없음)
  // 벽(IPD-TASK-013)
  var WALL_PAD = 8;          // 벽 사각형 바깥 여유
  var HIT_CUT = 0.15;        // 충돌 상자 = 그림 상자에서 각 변 15%씩 줄인 가운데 70%
  var PATH_STEP = 8;         // 걷기 경로를 확인하는 간격(px)
  var BOUNCE = 24;           // 튕겨 나오는 거리(px)
  var PICK_TRIES = 20;       // 목표 고르기 최대 시도
  var AWAY_TRIES = 8;        // 부딪힌 뒤 처음 몇 번은 벽에서 멀어지는 쪽만

  // 이동 방식(IPD-TASK-014): 'pass' = 통과(길은 벽 무시, 쉬는 곳만 빈 곳) / 'wall' = 013 벽 / 'off' = 011 방식
  var MOVES = ['pass', 'wall', 'off'];
  var MOVE_NAME = { pass: '통과', wall: '벽', off: '끔' };
  var OPACITIES = [100, 85, 70, 55];   // UI 배경 불투명도(%) — 배경색만, 글자·바늘·테두리는 그대로
  var state = { count: 3, speed: 'normal', stopped: false, night: false, cover: true, move: 'pass', ui: 85, showWalls: false };
  var pokes = [];
  var W = 0, H = 0, land = true;
  var clock = { cx: 0, cy: 0, r: 0 };
  var walls = [];            // { x0, y0, x1, y1, name, edge } — layout()이 만든다
  var bumpTotal = 0;

  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function now() { return Date.now(); }

  // ───────── 가짜 화면 배치 (A5-6) ─────────
  function place(el, x, y, w, h) {
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    land = W > H;
    var i, cards = [$('c0'), $('c1'), $('c2')];
    var glow = $('glow');
    if (land) {
      place($('face'), 24, 24, 360, 360);
      clock = { cx: 204, cy: 204, r: 180 };
      place($('digi'), 24, 392, 360, 84); $('digi').style.fontSize = '72px'; $('digi').style.lineHeight = '84px';
      place($('date'), 24, 486, 360, 32); $('date').style.fontSize = '26px'; $('date').style.lineHeight = '32px';
      place($('title'), 552, 24, 448, 52); $('title').style.lineHeight = '52px';
      for (i = 0; i < 3; i++) { place(cards[i], 552, 100 + i * 118, 448, 104); cards[i].style.lineHeight = '96px'; }
      place($('mom'), 24, 600, 476, 124); place($('dad'), 524, 600, 476, 124);
      $('mom').style.lineHeight = $('dad').style.lineHeight = '116px';
    } else {
      place($('face'), 224, 24, 320, 320);
      clock = { cx: 384, cy: 184, r: 160 };
      place($('digi'), 0, 354, W, 76); $('digi').style.fontSize = '64px'; $('digi').style.lineHeight = '76px';
      place($('date'), 0, 440, W, 30); $('date').style.fontSize = '24px'; $('date').style.lineHeight = '30px';
      place($('title'), 24, 488, 720, 52); $('title').style.lineHeight = '52px';
      for (i = 0; i < 3; i++) { place(cards[i], 24, 556 + i * 100, 720, 88); cards[i].style.lineHeight = '80px'; }
      place($('mom'), 24, 856, 348, 124); place($('dad'), 396, 856, 348, 124);
      $('mom').style.lineHeight = $('dad').style.lineHeight = '116px';
    }
    place(glow, clock.cx - clock.r * 1.6, clock.cy - clock.r * 1.6, clock.r * 3.2, clock.r * 3.2);
    buildWalls();
    if (state.move === 'wall') { relocateAll(); }
    else if (state.move === 'pass') { relocateEdge(); }   // 통과: 화면 밖만 안으로(벽 안이어도 둔다)
  }

  // ───────── 벽 (IPD-TASK-013) ─────────
  // 배치할 때 한 번 만든다. 디지털 시각·날짜·제목은 요소 상자가 아니라 글자 폭으로 잡는다
  // (세로 화면에서 요소가 화면 가로 전체라 상자로 잡으면 위아래가 끊긴다 — 승인 Q1).
  function boxOf(el) { return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; }
  function textBoxOf(el, span) {
    return { x: el.offsetLeft + span.offsetLeft, y: el.offsetTop, w: span.offsetWidth, h: el.offsetHeight };
  }
  function addWall(list, name, b, edge) {
    list.push({ name: name, edge: !!edge,
      x0: b.x - WALL_PAD, y0: b.y - WALL_PAD, x1: b.x + b.w + WALL_PAD, y1: b.y + b.h + WALL_PAD });
  }
  function buildWalls() {
    var list = [], i;
    addWall(list, 'face', boxOf($('face')));                 // 시계 원은 바깥 사각형으로

    if (meas.lastFrame) {
      var dt = n - meas.lastFrame;
      if (dt > 1000) { meas.segPause++; }      // 화면 꺼짐·다른 앱 등은 긴 프레임으로 세지 않는다
      else if (dt > 50) { meas.segLong++; }
    }
    meas.lastFrame = n;
    meas.segFrames++; meas.secFrames++;
    window.requestAnimationFrame(frame);
  }
  function fmtTime(ms) {
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + ':' + pad2(m) + ':' + pad2(s % 60);
  }

  // 저절로 다시 읽힘(Safari 메모리 부족 등) 세기:
  // 정상으로 떠날 때(pagehide)는 clean=true를 남긴다. 다음에 열 때 clean이 false이고
  // 마지막 기록이 1분 안이면 저절로 다시 읽힌 것으로 센다. [추정: 강제 종료 시 pagehide가 오지 않음]
  var store = { loads: 0, reloads: 0, clean: true, last: 0 };
  function loadStore() {
    try {
      var s = JSON.parse(window.localStorage.getItem(STORE_KEY) || 'null');
      if (s && typeof s.loads === 'number') { store = s; }
    } catch (e) { /* 저장 못 해도 시험은 계속 */ }
    if (store.clean === false && now() - (store.last || 0) < 60000) { store.reloads++; }
    store.loads++;
    store.clean = false;
    saveStore();
  }
  function saveStore() {
    store.last = now();
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 무시 */ }
  }

  function tick() {
    var n = now();
    var secs = (n - meas.lastSec) / 1000;
    if (secs > 0) {
      var f = meas.secFrames / secs;
      meas.recent.push(f);
      if (meas.recent.length > 10) { meas.recent.shift(); }
      if (n - meas.segStart > 3000 && f < meas.segMin && secs < 2) { meas.segMin = f; }  // 처음 3초는 준비 시간
    }
    meas.secFrames = 0; meas.lastSec = n;
    var segSec = (n - meas.segStart) / 1000;
    var avg = segSec > 0 ? meas.segFrames / segSec : 0;
    var min10 = 999, i;
    for (i = 0; i < meas.recent.length; i++) { if (meas.recent[i] < min10) { min10 = meas.recent[i]; } }
    $('stats').textContent =
      '포켓몬 ' + pokes.length + '마리' + (state.stopped ? ' (멈춤)' : '') + ' · ' + (state.speed === 'slow' ? '느림' : '보통') +
      ' · 가림 ' + (state.cover ? '켬' : '끔') + '\n' +
      '이동 ' + MOVE_NAME[state.move] + ' · UI 투명도 ' + state.ui + '%' + (state.night ? ' · 밤' : ' · 낮') + '\n' +
      '부딪힘(누적) ' + bumpTotal + '\n' +
      '평균 fps   ' + avg.toFixed(1) + '\n' +
      '최저(10초) ' + (min10 === 999 ? '-' : min10.toFixed(1)) + '\n' +
      '최저(설정후) ' + (meas.segMin === 999 ? '-' : meas.segMin.toFixed(1)) + '\n' +
      '긴 프레임(>50ms) ' + meas.segLong + (meas.segPause ? ' · 멈춤 ' + meas.segPause : '') + '\n' +
      '설정 후 ' + fmtTime(n - meas.segStart) + ' · 켜 둔 시간 ' + fmtTime(n - meas.start) + '\n' +
      'DPR ' + window.devicePixelRatio + ' · ' + W + '×' + H + ' · 누름 ' + tapTotal + '\n' +
      '열기 ' + store.loads + ' · 저절로 다시 읽힘 ' + store.reloads;
    drawClock();
    if (n - store.last > 5000) { saveStore(); }
  }

  // ───────── 조작 ─────────
  function sel(id, on) { $(id).className = on ? 'sel' : ''; }
  function refreshBar() {
    sel('n1', state.count === 1); sel('n3', state.count === 3); sel('n5', state.count === 5);
    sel('bStop', state.stopped); sel('bBg', state.night);
    $('bStop').textContent = state.stopped ? '움직이기' : '멈춤';
    $('bSpeed').textContent = '속도: ' + (state.speed === 'slow' ? '느림' : '보통');
    $('bCover').textContent = '카드 가림: ' + (state.cover ? '켬' : '끔');
    $('bWall').textContent = '이동: ' + MOVE_NAME[state.move];
    $('bOp').textContent = 'UI 투명도: ' + state.ui + '%';
    sel('bWallView', state.showWalls);
  }
  function setCount(n) {
    state.count = n;
    spawn(n);
    resetSeg();
    refreshBar();
  }
  // body의 class 하나로 가림·밤·UI 투명도를 정한다(CSS가 배경색만 바꿈, 요소 opacity는 건드리지 않음)
  function applyUiClass() {
    document.body.className = (state.cover ? '' : 'uiUnder ') + (state.night ? 'night ' : '') + 'op' + state.ui;
  }
  function bind(id, fn) { $(id).addEventListener('click', fn, false); }

  bind('n1', function () { setCount(1); });
  bind('n3', function () { setCount(3); });
  bind('n5', function () { setCount(5); });
  bind('bBg', function () {
    state.night = !state.night;
    $('bgNight').className = state.night ? 'bg on' : 'bg';
    applyUiClass();   // 카드·시계판도 밤 색으로(같은 투명도)
    refreshBar();
  });
  bind('bStop', function () { setStopped(!state.stopped); resetSeg(); refreshBar(); });
  bind('bSpeed', function () { state.speed = state.speed === 'slow' ? 'normal' : 'slow'; resetSeg(); refreshBar(); });
  bind('bCover', function () {
    state.cover = !state.cover;
    applyUiClass();
    resetSeg(); refreshBar();
  });
  bind('bWall', function () {
    // 통과 → 벽 → 끔 → 통과. 벽으로 바꿀 때만 벽 안의 포켓몬을 빈 곳으로 옮긴다(013과 같음).
    // 통과·끔으로 바꿀 때는 위치·타이머를 그대로 둔다(다음 걷기부터 새 규칙).
    state.move = MOVES[(MOVES.indexOf(state.move) + 1) % MOVES.length];
    if (state.move === 'wall') { relocateAll(); }
    resetSeg(); refreshBar();
  });
  bind('bOp', function () {
    state.ui = OPACITIES[(OPACITIES.indexOf(state.ui) + 1) % OPACITIES.length];
    applyUiClass();
    resetSeg(); refreshBar();
  });
  bind('bWallView', function () {
    state.showWalls = !state.showWalls;
    $('wallView').className = state.showWalls ? 'on' : '';
    refreshBar();
  });
  bind('bReset', function () {
    store = { loads: 1, reloads: 0, clean: false, last: 0 };
    saveStore();
    meas.start = now(); tapTotal = 0; bumpTotal = 0; resetSeg();
  });

  // 화면이 튕기거나 끌려 움직이지 않게
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
  window.addEventListener('pagehide', function () { store.clean = true; saveStore(); }, false);

  var relayoutTimer = 0;
  function onResize() {
    layout();
    // 회전 직후 값이 늦게 바뀌는 일이 있어 0.3초 뒤 한 번 더(A3-6). 이전 예약은 지운다.
    if (relayoutTimer) { clearTimeout(relayoutTimer); }
    relayoutTimer = setTimeout(function () { relayoutTimer = 0; layout(); }, 300);
  }
  window.addEventListener('resize', onResize, false);
  window.addEventListener('orientationchange', onResize, false);

  // ───────── 시작 ─────────
  loadStore();
  buildTicks();
  applyUiClass();
  layout();
  drawClock();
  setCount(3);
  window.requestAnimationFrame(frame);
  // 측정 표시 갱신용 1초 타이머. 이 시험 페이지에서만 허용(요청서 IPD-TASK-011 나):
  // 1초마다 fps를 계산해 표시하고, 가짜 시계 바늘도 같은 타이머에서 움직인다(메인의 1초 tick과 같은 부하).
  setInterval(tick, 1000);

  // 개발용(콘솔에서만, 화면·주소에는 없음): 완료 기준 시험에 쓴다. 상태를 바꾸지 않는 계산만 내보낸다.
  window.IPD_DEV = {
    walls: function () { return walls; },
    pokes: function () { return pokes; },
    hitWall: hitWall,
    pickTarget: pickTarget,
    planPath: planPath,
    currentXY: currentXY,
    bumps: function () { return bumpTotal; },
    bounds: bounds,
    state: state
  };
})();
</script>
</body>
</html>
